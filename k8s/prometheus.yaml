# Prometheus in Kubernetes: scrapes /metrics from the iris-api pods every 5s
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: iris-api
        metrics_path: /metrics
        dns_sd_configs:
          - names: [iris-api-pods.default.svc.cluster.local]
            type: A
            port: 8000
---
# Headless service so Prometheus can discover (and scrape) every API pod separately
apiVersion: v1
kind: Service
metadata:
  name: iris-api-pods
spec:
  clusterIP: None
  selector:
    app: iris-api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
